<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"1.0">
    <title>WiFly485 Web管理界面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WiFly485 管理界面</h1>
            <p>ESP8266 RS485 WiFi中继系统</p>
        </header>
        
        <main>
            <section class="status-section">
                <h2>设备状态</h2>
                <div class="status-grid">
                    <div class="status-item">
                        <span class="label">设备角色:</span>
                        <span id="device-role" class="value">加载中...</span>
                    </div>
                    <div class="status-item">
                        <span class="label">设备名称:</span>
                        <span id="device-name" class="value">加载中...</span>
                    </div>
                    <div class="status-item">
                        <span class="label">WiFi状态:</span>
                        <span id="wifi-status" class="value">加载中...</span>
                    </div>
                    <div class="status-item">
                        <span class="label">IP地址:</span>
                        <span id="ip-address" class="value">加载中...</span>
                    </div>
                    <div class="status-item">
                        <span class="label">运行时间:</span>
                        <span id="uptime" class="value">加载中...</span>
                    </div>
                </div>
            </section>
            
            <section class="control-section">
                <h2>系统控制</h2>
                <div class="button-group">
                    <button id="config-btn" class="btn btn-primary">配置管理</button>
                    <button id="reboot-btn" class="btn btn-danger">重启设备</button>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2025 WiFly485 项目</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
